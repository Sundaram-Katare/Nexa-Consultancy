services:
  ollama:
    image: ollama/ollama:latest
    container_name: nexa_ollama
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "${OLLAMA_HOST_PORT:-11434}:11434"
    networks:
      - nexa_network

  n8n:
    image: n8nio/n8n:latest
    container_name: nexa_n8n
    restart: unless-stopped
    environment:
      - N8N_PORT=${N8N_PORT:-5678}
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-nexa_super_secret_encryption_key_32chars}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-UTC}
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "${N8N_PORT:-5678}:5678"
    networks:
      - nexa_network

  agent:
    build:
      context: ../agent
      dockerfile: Dockerfile
    container_name: nexa_agent
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434}
      - AGENT_PORT=${AGENT_PORT:-3000}
      - NODE_ENV=${NODE_ENV:-development}
    volumes:
      - agent_logs:/app/logs
    ports:
      - "${AGENT_PORT:-3000}:3000"
    networks:
      - nexa_network

networks:
  nexa_network:
    driver: bridge

volumes:
  n8n_data:
    name: nexa_n8n_data
  ollama_models:
    name: nexa_ollama_models
  agent_logs:
    name: nexa_agent_logs
